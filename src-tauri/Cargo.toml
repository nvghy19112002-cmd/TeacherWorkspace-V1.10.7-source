[package]
name = "teacher-workspace"
version = "2.0.0"
description = "An offline workspace for teachers"
authors = ["Teacher Workspace"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "teacher_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-single-instance = "=2.4.0"
tauri-plugin-updater = { version = "=2.11.0", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "=2.3.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
