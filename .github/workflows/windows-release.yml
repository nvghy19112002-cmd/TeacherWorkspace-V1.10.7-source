name: Publish Windows update
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - run: node scripts/check-native-lock.mjs
      - run: npm ci
      - name: Resolve updater release destination
        id: channel
        run: node scripts/release-channel.mjs
      - name: Require configured release channel
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/check-release.mjs
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Normalize updater signing key
        shell: pwsh
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $key = $env:RAW_TAURI_SIGNING_PRIVATE_KEY.Trim()
          if (-not $key) { throw 'TAURI_SIGNING_PRIVATE_KEY is empty after normalization.' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TAURI_SIGNING_PRIVATE_KEY=$key`n", [Text.UTF8Encoding]::new($false))
      - name: Build and sign Windows installer with actionable diagnostics
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run desktop:build -- --target x86_64-pc-windows-msvc -- --locked 2>&1 | Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) {
            $details = (Get-Content tauri-build.log -Tail 30) -join "`n"
            $details = $details -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=Signed Windows build failed::$details"
            exit 1
          }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: ${{ steps.channel.outputs.owner }}
          repo: ${{ steps.channel.outputs.name }}
          tagName: v__VERSION__
          releaseName: Teacher Workspace v__VERSION__
          releaseBody: 'Teacher Workspace: bản Windows có chữ ký updater. Ứng dụng tự sao lưu dữ liệu trước khi cập nhật. Source: https://github.com/${{ github.repository }}/commit/${{ github.sha }}'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Verify uploaded assets and publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
      - name: Preserve release failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-diagnostics
          path: test-results/
